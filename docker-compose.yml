# PostgreSQL 17 and MongoDB 8 for local development.
# Both databases keep their files on disk under ./data, so data survives restarts.
# The PostgreSQL password comes from your .env file (copy .env.example); it is never stored in this file.
services:
  postgres:
    image: postgres:17
    container_name: scu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-smart_city}
      TZ: Asia/Kolkata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scu} -d ${POSTGRES_DB:-smart_city}"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:8
    container_name: scu-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - ./data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 20
